name: Verificar inventário sem publicar
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependência apenas de testes
        run: npm install --no-save jsdom@26
      - name: Validar sintaxe de todos os scripts
        run: |
          node --check public/photo-editor.js
          node --check public/excel-export.js
          node --check public/app.js
          node --check public/identity-ui.js
          node --check public/component-art.js
          node --check public/final.js
          node --check public/admin-stage.js
          node --check src/index.js
          node --check src/identity.js
          node --check src/mail-bridge.js
      - name: Testar fusão dos 26 lotes de Experimentos sem afetar banco remoto
        run: node --disable-warning=ExperimentalWarning tests/experiments.test.mjs
      - name: Testar central de vínculos, grupos vazios e Excel sem tocar D1 remoto
        run: node --disable-warning=ExperimentalWarning tests/central-vinculos.test.mjs
      - name: Testar migração de descarte e saldos sem defeitos
        run: node --disable-warning=ExperimentalWarning tests/estoque-simplificado.test.mjs
      - name: Testar vínculo inicial das famílias sem misturar estoque
        run: node --disable-warning=ExperimentalWarning tests/variation-linking.test.mjs
      - name: Testar arquivados e reparo do vínculo Arduino no D1 isolado
        run: node --disable-warning=ExperimentalWarning tests/archived-groups.test.mjs
      - name: Testar categorias e filamentos na reserva e devolução
        run: node --disable-warning=ExperimentalWarning tests/loans-permissions.test.mjs
      - name: Testar reorganização Robótica e Equipamentos no banco isolado
        run: node --disable-warning=ExperimentalWarning tests/catalog-categories.test.mjs
      - name: Testar central de Ajuda e impressão/PDF
        run: node tests/help.test.mjs
      - name: Testar limpeza e reset seguro das reservas em banco isolado
        run: node --disable-warning=ExperimentalWarning tests/reservations-cleanup.test.mjs
      - name: Testar backup completo e restauração no banco isolado
        run: node --disable-warning=ExperimentalWarning tests/backup-v2.test.mjs
      - name: Testar segurança e fila de cobranças Gmail
        run: node --disable-warning=ExperimentalWarning tests/gmail.test.mjs
      - name: Testar banco local, identidade e reservas
        run: node --disable-warning=ExperimentalWarning tests/identity.test.mjs
      - name: Testar permissões, histórico, grupos e exclusão no banco isolado
        run: node --disable-warning=ExperimentalWarning tests/access.test.mjs
      - name: Testar navegação antiga, sem tocar na produção
        run: node tests/admin-navigation.test.mjs
      - name: Testar catálogo e painel novos, sem tocar na produção
        run: node tests/final-ui.test.mjs
      - name: Testar fotos individuais e cores dos LEDs
        run: node tests/led-colors.test.mjs
      - name: Auditar desenhos e correspondências dos 213 materiais
        run: node tests/component-art.test.mjs

      - name: Conferir que o catálogo ilustrado está realmente disponível no site
        run: |
          node --input-type=module <<'NODE'
          const root="https://inventario-pet.pet-educacao.workers.dev";
          const files=[
            {url:"/",checks:['id="public-sidebar"','id="search"','/component-art.js']},
            {url:"/component-art.js",checks:["imageForPETItem","componentArt"]},
            {url:"/final.js",checks:["function itemImage(x){return imageForPETItem(x);}","public-menu-toggle"],forbidden:["commons.wikimedia.org"]},
            {url:"/final.css",checks:[".public-sidebar",".catalog-card","grid-template-columns:repeat(4,minmax(0,1fr))"]}
          ];
          for(const file of files){
            let result,body="";
            for(let retry=0;retry<5;retry++){
              result=await fetch(root+file.url,{headers:{"cache-control":"no-cache"}});
              body=await result.text();
              if(result.ok&&file.checks.every(marker=>body.includes(marker))&&!(file.forbidden||[]).some(marker=>body.includes(marker)))break;
              if(retry<4)await new Promise(resolve=>setTimeout(resolve,1200));
            }
            if(!result.ok||file.checks.some(marker=>!body.includes(marker))||(file.forbidden||[]).some(marker=>body.includes(marker))){
              throw Error(file.url+" não corresponde ao layout ilustrado publicado (HTTP "+result.status+").");
            }
            console.log("PUBLICADO OK: "+file.url);
          }
          NODE

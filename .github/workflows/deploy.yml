name: Publicar inventario PET
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: inventario-pet-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save wrangler@4 jsdom@26
      - name: Aplicar tabelas ao D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUD_PET || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 23d809e1e820e30b3f95c24ea771f579
        run: npx wrangler d1 migrations apply DB --remote
      - name: Conferir estrutura das reservas
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUD_PET || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 23d809e1e820e30b3f95c24ea771f579
        run: npx wrangler d1 execute DB --remote --command "PRAGMA table_info(reservas)"
      - name: Verificar sintaxe dos scripts
        run: |
          node --check public/app.js
          node --check public/identity-ui.js
          node --check src/index.js
          node --check src/identity.js
      - name: Contar reservas do banco sem mostrar dados pessoais
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUD_PET || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 23d809e1e820e30b3f95c24ea771f579
        run: npx wrangler d1 execute DB --remote --command "SELECT status, COUNT(*) AS total FROM reservas GROUP BY status"
      - name: Diagnosticar limpeza de reservas (sem dados pessoais)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUD_PET || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 23d809e1e820e30b3f95c24ea771f579
        run: |
          npx wrangler d1 execute DB --remote --command "SELECT chave,valor FROM configuracoes WHERE chave='limpeza_reservas'"
          npx wrangler d1 execute DB --remote --command "SELECT status,COUNT(*) AS total, SUM(CASE WHEN status='devolvida' AND devolvido_em IS NOT NULL AND devolvido_em < strftime('%Y-%m-%dT%H:%M:%fZ','now','-1 minute') THEN 1 ELSE 0 END) AS expiradas FROM reservas GROUP BY status"
      - name: Testar IDs, tags e retiradas no banco local
        run: node --disable-warning=ExperimentalWarning tests/identity.test.mjs
      - name: Testar abas e login no navegador simulado
        run: node tests/admin-navigation.test.mjs
      - name: Publicar site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUD_PET || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 23d809e1e820e30b3f95c24ea771f579
        run: npx wrangler deploy
      - name: Configurar senha do painel
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUD_PET || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 23d809e1e820e30b3f95c24ea771f579
          ADMIN_PASSWORD: ${{ secrets.PET_ADMIN_PASSWORD }}
        run: |
          if [ -z "$ADMIN_PASSWORD" ]; then echo "Falta PET_ADMIN_PASSWORD"; exit 1; fi
          printf '%s' "$ADMIN_PASSWORD" | npx wrangler secret put ADMIN_PASSWORD

      - name: Verificar acesso publico e bloqueios de seguranca
        run: |
          node --input-type=module <<'NODE'
          const root="https://inventario-pet.pet-educacao.workers.dev";
          const me=await fetch(root+"/api/identity/me");
          if(!me.ok || (await me.json()).usuario!==null)throw Error("Perfil anonimo nao protegido");
          const users=await fetch(root+"/api/admin/users");
          if(users.status!==401)throw Error("Listagem de usuarios publica");
          const loan=await fetch(root+"/api/member/withdraw",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({componente_id:1,quantidade:1,data_devolucao:"2027-01-01"})});
          if(loan.status!==403)throw Error("Retirada sem tag PETiano permitida");
          const js=await fetch(root+"/identity-ui.js");
          if(!js.ok || !(await js.text()).includes("Registrar retirada"))throw Error("Interface de identidade nao publicada");
          const html=await fetch(root+"/");
          if(!html.ok || !(await html.text()).includes("identity-ui.js"))throw Error("Pagina nao carrega a identidade");
          console.log("PUBLICO OK: identidade, autorizacoes, interface e protecao do admin.");
          NODE
      - name: Teste real de cadastro e login com exclusao automatica do teste
        env:
          ADMIN_PASSWORD: ${{ secrets.PET_ADMIN_PASSWORD }}
        run: node tests/live-login.mjs
      - name: Teste funcional completo do inventário
        env:
          ADMIN_PASSWORD: ${{ secrets.PET_ADMIN_PASSWORD }}
        run: |
          node --input-type=module <<'NODE'
          const root = "https://inventario-pet.pet-educacao.workers.dev";
          const get = async (path,options={})=>{
            const r=await fetch(root+path,{...options,headers:{"content-type":"application/json",...(options.headers||{})}});
            const d=await r.json().catch(()=>({}));
            if(!r.ok)throw Error(path+" ("+r.status+"): "+(d.error||JSON.stringify(d)).slice(0,160));
            return {d,r};
          };
          const health=(await get("/api/health")).d;
          if(!health.ok||health.database!=="connected")throw Error("D1 sem conexão");
          const catalog=(await get("/api/catalog")).d;
          if((catalog.categorias||[]).length<5||(catalog.componentes||[]).length<5)throw Error("Faltam materiais de demonstração");
          const login=await get("/api/login",{method:"POST",body:JSON.stringify({senha:process.env.ADMIN_PASSWORD})});
          const cookie=login.r.headers.get("set-cookie")?.split(";")[0];
          if(!cookie)throw Error("O login não retornou cookie de sessão");
          const admin=async(path,method="GET",body)=>get(path,{method,headers:{cookie},...(body===undefined?{}:{body:JSON.stringify(body)})});
          const stamp=Date.now(), name="E2E TEMP "+stamp;
          const cat=catalog.categorias[0], itemPayload={categoria_id:cat.id,nome:name,imagem:"",patrimonio:"TESTE",identificacao:"",quantidade:3,em_uso:0,com_defeito:0,mostrar_quantidade:true,mostrar_em_uso:true,mostrar_defeito:true,descricao_defeito:"",responsavel:"Teste automatizado"};
          let id=null, resId=null, phase="none";
          try{
            await admin("/api/admin/item","POST",itemPayload);
            const state=(await admin("/api/admin/state")).d;
            id=state.componentes.find(x=>x.nome===name)?.id;
            if(!id)throw Error("Material de teste não foi salvo");
            const start=new Date(Date.now()+3*86400000).toISOString().slice(0,10),end=new Date(Date.now()+5*86400000).toISOString().slice(0,10);
            const avail=(await get("/api/availability?id="+id+"&inicio="+start+"&fim="+end)).d;
            if(avail.disponiveis!==3)throw Error("Disponibilidade inconsistente");
            await get("/api/reservations",{method:"POST",body:JSON.stringify({componente_id:id,quantidade:1,data_inicio:start,data_devolucao:end,nome_solicitante:"Visitante de teste"})});
            const pending=(await admin("/api/admin/state")).d.reservas.find(r=>r.componente_id===id&&r.status==="pendente");
            if(!pending)throw Error("Pedido de reserva não chegou ao administrador");
            resId=pending.id;
            await admin("/api/admin/reservation","POST",{id:resId,acao:"aprovar",responsavel:"Teste automático"});phase="aprovada";
            await admin("/api/admin/reservation","POST",{id:resId,acao:"retirar",responsavel:"Teste automático"});phase="retirada";
            await admin("/api/admin/reservation","POST",{id:resId,acao:"devolver",responsavel:"Teste automático",defeituosos:0});phase="devolvida";
            const result=(await admin("/api/admin/state")).d;
            const updated=result.componentes.find(x=>x.id===id);
            if(updated.em_uso!==0||result.reservas.find(r=>r.id===resId)?.status!=="devolvida")throw Error("Devolução inconsistente");
            console.log("TESTE OK: D1, catálogo, admin, criação, reserva, aprovação, retirada e devolução.");
            console.log("Itens fictícios disponíveis:",catalog.componentes.length);
          }finally{
            if(id){
              try{
                if(resId&&["aprovada","retirada"].includes(phase)) await admin("/api/admin/reservation","POST",{id:resId,acao:phase==="aprovada"?"recusar":"devolver",responsavel:"Teste automático",defeituosos:0});
                if(!resId||phase!=="none") await admin("/api/admin/item?id="+id,"DELETE");
                else { const r=await admin("/api/admin/state"); const x=r.d.reservas.find(r=>r.componente_id===id&&r.status==="pendente"); if(x){await admin("/api/admin/reservation","POST",{id:x.id,acao:"recusar",responsavel:"Teste automático"});} await admin("/api/admin/item?id="+id,"DELETE"); }
              }catch(error){ console.error("AVISO: falha na limpeza do teste:",error.message); }
            }
          }
          NODE

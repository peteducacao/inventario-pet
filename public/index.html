<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d2e46">
<meta name="description" content="Inventário do PET Educação.">
<title>Inventário do PET Educação</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/styles.css?v=final-1">
<link rel="stylesheet" href="/final.css?v=final-1">
<script defer src="/app.js?v=final-1"></script>
<script defer src="/identity-ui.js?v=final-1"></script>
<script defer src="/final.js?v=final-1"></script>
</head>
<body>
<div id="app">
<header class="topbar"><div class="shell topbar-inner">
<div class="branding"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 36 36" width="30" height="30"><path fill="#b9f2e0" d="M3 8q8-4 15 2 7-6 15-2v20q-8-4-15 2-7-6-15-2z"/><path fill="#15b991" d="M18 10v20M7 12q4-1 8 2m6 0q4-3 8-2" stroke="#0c5362" stroke-width="1.4"/></svg></span><div><strong>Inventário do PET Educação</strong></div></div>
<div class="header-actions">
<button type="button" class="nav-icon notification-bell" id="notification-button" aria-label="Notificações" title="Notificações"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9ZM10 21h4"/></svg><span id="notification-count" class="notification-count" hidden>0</span></button>
<button class="quiet-button profile-trigger" id="profile-button" type="button"><span class="avatar" id="header-avatar">P</span><span id="profile-name">Entrar</span><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></button>
<button class="header-admin" id="admin-button" type="button" title="Administração"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19 13.6v-3.2l-2.2-.7-.6-1.4 1.1-2-2.3-2.3-2 1.1-1.4-.6L10.9 2H7.7l-.7 2.5-1.4.6-2-1.1-2.3 2.3 1.1 2-.6 1.4L0 10.4v3.2l2.2.7.6 1.4-1.1 2L4 20l2-1.1 1.4.6.7 2.5h3.2l.7-2.5 1.4-.6 2 1.1 2.3-2.3-1.1-2 .6-1.4z" transform="translate(2) scale(.84)"/></svg><span id="admin-button-text">Admin</span></button>
</div></div></header>
<main class="shell">
<div id="offline-alert" class="alert alert-error" hidden>Não foi possível carregar os materiais. <button id="retry-button" type="button">Tentar novamente</button></div>
<section class="intro"><div><h1>Inventário do PET Educação</h1></div><div class="intro-actions"><button type="button" id="reserve-button" class="primary-button">Reservar material</button></div></section>
<div id="demo-notice" class="demo-notice" hidden>Inventário de demonstração</div>
<section id="summary" class="stats-section" aria-label="Resumo do estoque">
<div class="stats-head"><span>Resumo do inventário</span><button id="stats-toggle" class="text-icon-button" type="button" aria-expanded="true"><span id="stats-toggle-text">Minimizar</span><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 15 6-6 6 6"/></svg></button></div>
<div class="summary" id="stats-content"><div class="summary-item"><span class="summary-label">Cadastrados</span><strong id="stat-items">—</strong></div><div class="summary-item"><span class="summary-label">Disponíveis</span><strong id="stat-stock">—</strong></div><div class="summary-item"><span class="summary-label">Em uso</span><strong id="stat-used">—</strong></div><div class="summary-item"><span class="summary-label">Com defeito</span><strong id="stat-broken">—</strong></div></div>
</section>
<section class="inventory-section">
<div class="inventory-head"><h2>Materiais</h2><div class="catalog-toolbar"><div class="search-box"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></svg><input type="search" id="search" aria-label="Buscar material" placeholder="Buscar material ou patrimônio..."></div><select id="catalog-sort" aria-label="Ordenar materiais"><option value="az">Nome: A–Z</option><option value="za">Nome: Z–A</option><option value="recent">Última alteração</option><option value="old">Mais antigos</option><option value="available">Mais disponíveis</option><option value="less">Menos disponíveis</option></select></div></div>
<div class="filter-row" id="category-filters"></div>
<div id="category-sections" class="section-list"><div class="loading-placeholder">Carregando inventário…</div></div>
<nav class="page-controls" id="catalog-pagination" aria-label="Páginas de materiais"></nav>
</section>
<footer class="site-footer"><span>Inventário do PET Educação</span><span id="last-updated">Atualização do inventário</span></footer>
</main></div>
<div id="admin-stage" hidden></div><div id="toast" class="toast" role="status" aria-live="polite"></div><div id="modal-root"></div><div id="notification-popover" hidden></div>
</body></html>

<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inventário PET</title><style>body{margin:0;background:#f7f9fc;color:#182337;font:16px system-ui,Arial,sans-serif;display:grid;min-height:100dvh;place-items:center}.card{max-width:540px;margin:24px;padding:36px;background:white;border:1px solid #e2e8f0;border-radius:20px;box-shadow:0 16px 40px #10203012}h1{font-size:28px}.muted{color:#5d6879}code{background:#edf4ff;padding:4px;border-radius:4px}</style></head><body><main class="card"><h1>Inventário PET</h1><p class="muted">Estrutura técnica em configuração. Esta é uma página de teste para confirmar a publicação do site e a conexão ao banco Cloudflare D1.</p><p id="status">Verificando banco de dados...</p></main><script>fetch('/api/health').then(r=>r.json()).then(j=>document.getElementById('status').textContent=j.ok?'Conexão com D1 funcionando!':'D1 ainda não conectado.').catch(()=>document.getElementById('status').textContent='API ainda não disponível.');</script></body></html>
